<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE CRATE — TC-16</title>
<style>
:root{
  --ground:#0a0a0b;
  --chassis:#cdccc6; --chassis-hi:#e4e3dd; --chassis-lo:#adaca5;
  --well:#8e8d86;
  --ink:#0e0e10; --ink-2:#54544d;
  --signal:#e0301e; --cobalt:#2340d8; --sulphur:#f0c419; --mint:#5fc7a4;
  --screen:#000; --trace:#f2f1ec; --trace-dim:#5e5e58;
  --pad:#17171a; --pad-hi:#232327;
  --hair:rgba(0,0,0,.2);
  --sans: ui-sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--ground); color:var(--ink);
  min-height:100%; display:flex; align-items:flex-start; justify-content:center;
  padding:22px 12px 64px; -webkit-font-smoothing:antialiased;
}
.silk{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}

/* ---------- chassis ---------- */
.machine{
  width:100%;max-width:1080px;background:var(--chassis);
  background-image:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 180px);
  border-radius:3px;padding:0;position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 30px 70px rgba(0,0,0,.75);
}
.pane{padding:14px 16px;border-bottom:1px solid var(--hair)}
.pane:last-child{border-bottom:0}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:16px 16px 12px}
.mast h1{font-size:15px;letter-spacing:.46em;font-weight:800;text-transform:uppercase;line-height:1}
.mast .rule{flex:1;height:1px;background:var(--ink);opacity:.22;margin-bottom:4px;min-width:20px}
.mast .spec{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-2);text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--signal);display:inline-block;margin-bottom:2px}

/* ---------- controls ---------- */
button{font-family:var(--sans);cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
/* ---- family 1: KEY — momentary, real press travel ---- */
.key,.btn,.tog{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:8.5px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;
  padding:9px 12px;border-radius:3px;color:var(--ink);
  background:linear-gradient(180deg,#f4f3ee,#cbcac3);
  box-shadow:0 2px 0 #9d9c95, 0 3px 5px rgba(0,0,0,.16), inset 0 1px 0 #fff;
  transition:transform .04s, box-shadow .04s, background .1s;
}
.key:active,.btn:active,.tog:active{
  transform:translateY(2px);
  box-shadow:0 0 0 #9d9c95, inset 0 2px 4px rgba(0,0,0,.32);
}
.key.dark{color:#f4f3ee;background:linear-gradient(180deg,#3d3d42,#1b1b1f);
  box-shadow:0 2px 0 #08080a, 0 3px 5px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.09)}
.key.dark:active{box-shadow:0 0 0 #08080a, inset 0 2px 5px rgba(0,0,0,.6)}
.key.dark[aria-pressed="true"]{background:linear-gradient(180deg,#ffd84d,#e8b800);color:#141417;
  box-shadow:0 2px 0 #8d7000, inset 0 1px 0 rgba(255,255,255,.4)}
.key.danger,.tog.warn{color:#fff;background:linear-gradient(180deg,#ea5540,#c2331f);
  box-shadow:0 2px 0 #8a2414, inset 0 1px 0 rgba(255,255,255,.25)}
.key.danger:active{box-shadow:0 0 0 #8a2414, inset 0 2px 4px rgba(0,0,0,.4)}
.key[disabled],.tog[disabled]{opacity:.3;cursor:not-allowed;transform:none;
  box-shadow:0 1px 0 #b7b6af, inset 0 1px 0 rgba(255,255,255,.5)}
.key.sm{font-size:8px;padding:6px 9px;letter-spacing:.12em;
  box-shadow:0 1px 0 #a8a7a0, inset 0 1px 0 rgba(255,255,255,.65)}
.key.sm:active{box-shadow:0 0 0, inset 0 1px 3px rgba(0,0,0,.28);transform:translateY(1px)}

/* ---- family 2: SWITCH — latches, tells you with an LED ---- */
.sw{
  display:inline-flex;align-items:center;gap:7px;
  font-size:8.5px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;
  padding:9px 12px 9px 10px;border-radius:3px;color:var(--ink);
  background:linear-gradient(180deg,#eeede8,#d4d3cc);
  box-shadow:0 2px 0 #a3a29b, 0 3px 5px rgba(0,0,0,.14), inset 0 1px 0 #fff;
  transition:transform .04s, box-shadow .04s, background .12s;
}
.sw:active{transform:translateY(2px);box-shadow:0 0 0 #a3a29b, inset 0 2px 4px rgba(0,0,0,.3)}
.sw .led{width:6px;height:6px;border-radius:50%;flex:none;background:#918f88;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.55);transition:background .12s, box-shadow .12s}
.sw[aria-pressed="true"]{color:#f4f3ee;background:linear-gradient(180deg,#2e2e33,#141417);
  box-shadow:0 2px 0 #050506, inset 0 1px 0 rgba(255,255,255,.08)}
.sw[aria-pressed="true"] .led{background:var(--sulphur);box-shadow:0 0 7px var(--sulphur)}
.sw.rec[aria-pressed="true"] .led{background:var(--signal);box-shadow:0 0 8px var(--signal)}
.sw .val{font-weight:400;letter-spacing:.06em;opacity:.72;min-width:46px;text-align:right;text-transform:none}
.sw[disabled]{opacity:.3;cursor:not-allowed}

/* ---- family 3: SEGMENT — one control, pick a position ---- */
.seg{display:inline-flex;border-radius:3px;overflow:hidden;vertical-align:middle;
  box-shadow:0 2px 0 #a3a29b, inset 0 0 0 1px rgba(0,0,0,.16)}
.seg button{font-size:8.5px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;
  padding:9px 11px;color:var(--ink-2);border-radius:0;
  background:linear-gradient(180deg,#eeede8,#dad9d2);
  border-right:1px solid rgba(0,0,0,.15);transition:background .1s, color .1s}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:linear-gradient(180deg,#f6f5f0,#e2e1da)}
.seg button[aria-pressed="true"]{color:#f4f3ee;background:linear-gradient(180deg,#2e2e33,#141417)}
.seg.amber button[aria-pressed="true"]{color:#141417;background:linear-gradient(180deg,#ffd84d,#e8b800)}
.seg:active{box-shadow:0 1px 0 #a3a29b, inset 0 0 0 1px rgba(0,0,0,.16)}

/* ---- modules: group hard, and let the boring stuff recede ---- */
.mod{margin-top:13px;padding:11px 11px 12px;border-radius:4px;
  background:rgba(0,0,0,.025);box-shadow:inset 0 0 0 1px var(--hair)}
.mod > .silk{display:block;margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.mod.perform{background:rgba(0,0,0,.075);box-shadow:inset 0 0 0 1px rgba(0,0,0,.26)}
.mod.minor{background:none;box-shadow:none;padding:0 1px;margin-top:11px}
.mod.minor > .silk{opacity:.62;font-size:8px;margin-bottom:6px}
.tog.hot[aria-pressed="true"]{background:var(--signal);color:#fff}
.tog.ghost{background:none;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2)}
.tog.ghost:hover{color:var(--ink);background:rgba(0,0,0,.05)}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.grp{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}
.sect{margin-top:12px}
.sect > .silk{display:block;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--hair)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink);opacity:.55}
input[type=range]::-moz-range-track{height:2px;background:var(--ink);opacity:.55}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;
  border-radius:50%;margin-top:-5.5px;background:var(--ink);box-shadow:0 0 0 3px var(--chassis)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;
  background:var(--ink);box-shadow:0 0 0 3px var(--chassis)}
input[type=range]:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
select{font-family:var(--mono);font-size:9px;padding:6px 7px;border-radius:2px;border:1px solid var(--hair);
  background:var(--chassis-hi);color:var(--ink);text-transform:uppercase;letter-spacing:.08em}

.knobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.knob{display:flex;flex-direction:column;gap:2px}
.knob .kh{display:flex;justify-content:space-between;align-items:baseline}
.kv{font-family:var(--mono);font-size:10px;color:var(--ink)}

/* ---------- crate ---------- */
.crate-row{display:flex;gap:6px;margin-top:6px}
.field{flex:1;background:var(--screen);border-radius:2px;display:flex;align-items:center}
.field input{width:100%;background:transparent;border:0;outline:0;font-family:var(--mono);
  font-size:12px;color:var(--trace);padding:10px 11px;letter-spacing:.05em}
.field input::placeholder{color:var(--trace-dim)}
.field input:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:5px 7px;
  border-radius:2px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--hair)}
.chip:hover{color:var(--ink);background:rgba(0,0,0,.06)}
.results{margin-top:8px;max-height:180px;overflow-y:auto;display:none;
  box-shadow:inset 0 0 0 1px var(--hair);border-radius:2px}
.results.open{display:block}
.res{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 9px;
  border-bottom:1px solid var(--hair)}
.res:hover,.res:focus-visible{background:var(--sulphur)}
.res img{width:28px;height:28px;flex:none;background:var(--well)}
.res .meta{min-width:0;flex:1}
.res .t{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .a{font-size:9.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);padding:9px;line-height:1.5}

/* ---------- deck ---------- */
.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

/* display */
.screen{background:var(--screen);border-radius:2px;padding:11px 12px 9px;position:relative;overflow:hidden}
.scr-head{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.16em;color:var(--trace-dim);text-transform:uppercase;margin-bottom:6px}
.scr-title{font-family:var(--mono);font-size:12px;color:var(--trace);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:.03em}
.scr-sub{font-family:var(--mono);font-size:9.5px;color:var(--trace-dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-bottom:8px}
canvas#ridge{display:block;width:100%;height:150px}
canvas#trim{display:block;width:100%;height:30px;margin-top:7px;cursor:ew-resize;touch-action:none}
.scr-foot{display:flex;justify-content:space-between;gap:5px;font-family:var(--mono);font-size:8.5px;
  color:var(--trace-dim);letter-spacing:.08em;margin-top:6px;text-transform:uppercase}

/* pads */
.pad-well{background:var(--well);border-radius:3px;padding:8px;box-shadow:inset 0 1px 4px rgba(0,0,0,.4)}
.pad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pad{position:relative;aspect-ratio:1/1;border-radius:3px;padding:5px;overflow:hidden;text-align:left;
  background:var(--pad);touch-action:manipulation;display:flex;flex-direction:column;
  justify-content:space-between;transition:transform .05s, background .1s;
  box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07)}
.pad .num{font-family:var(--mono);font-size:8.5px;color:rgba(255,255,255,.42);letter-spacing:.06em}
.pad .key{position:absolute;top:4px;right:4px;font-family:var(--mono);font-size:9px;font-weight:700;
  color:var(--ink);background:var(--chassis-hi);padding:1px 4px;border-radius:1px}
.pad .lbl{font-size:8.5px;line-height:1.2;font-weight:700;color:rgba(255,255,255,.8);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pad .tag{position:absolute;left:5px;bottom:4px;font-family:var(--mono);font-size:8.5px;font-weight:700;
  color:var(--ink);padding:1px 4px;border-radius:1px;background:var(--sulphur);display:none}
.pad.tagged .tag{display:block}
.pad.tagged .lbl{margin-bottom:12px}
.pad .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.pad.loaded .stripe{background:var(--mint)}
.pad.drum .stripe{background:var(--cobalt)}
.pad.tuned .stripe{background:var(--sulphur)}
.pad.hit{transform:translateY(2px);background:var(--signal);box-shadow:inset 0 1px 4px rgba(0,0,0,.4)}
.pad.hit .lbl,.pad.hit .num{color:#fff}
.pad.sel{box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 0 0 2px var(--signal)}
.pad.drop{box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 0 0 2px var(--mint)}
.pad:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.pad .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--signal);width:0}
.pad .loopdot{position:absolute;bottom:4px;right:5px;width:5px;height:5px;border-radius:50%;
  background:var(--mint);display:none}
.pad.looping .loopdot{display:block}
.bank-row{display:flex;align-items:center;gap:5px;margin-bottom:7px;flex-wrap:wrap}

/* transport */
.transport{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{min-width:52px;min-height:40px;padding:0 12px;border-radius:2px;font-size:9px;letter-spacing:.14em;
  font-weight:700;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,var(--chassis-hi),var(--chassis-lo));
  box-shadow:0 1px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.7);transition:transform .05s}
.tbtn{box-shadow:0 2px 0 #9d9c95, 0 3px 5px rgba(0,0,0,.16), inset 0 1px 0 #fff}
.tbtn:active{transform:translateY(2px);box-shadow:0 0 0 #9d9c95, inset 0 2px 4px rgba(0,0,0,.32)}
.tbtn .led{width:6px;height:6px;border-radius:50%;background:#8a8981}
.tbtn[aria-pressed="true"] .led{background:var(--signal)}
.tbtn.play[aria-pressed="true"] .led{background:var(--mint)}
.tbtn.panic{color:#fff;background:linear-gradient(180deg,#ea5540,#c2331f);
  box-shadow:0 2px 0 #8a2414, inset 0 1px 0 rgba(255,255,255,.25)}
.tbtn.panic:active{box-shadow:0 0 0 #8a2414, inset 0 2px 4px rgba(0,0,0,.4)}
.slider-cell{display:flex;align-items:center;gap:8px;min-width:180px;flex:1}
.slider-cell .kv{min-width:52px;text-align:right}

/* sequencer */
.seq-head{display:flex;align-items:center;gap:8px 14px;margin-bottom:6px;flex-wrap:wrap}
.brow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-bottom:4px}
.brow > .silk{text-align:right;font-size:8px;letter-spacing:.1em}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.step{aspect-ratio:1/1.4;min-height:24px;border-radius:1px;background:var(--well);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);transition:background .06s}
.step.beat{background:#9e9d96}
.step.on{background:var(--ink)}
.step.cur{box-shadow:inset 0 0 0 2px var(--signal)}
.step:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
.lrow{display:grid;grid-template-columns:minmax(64px,92px) auto 1fr;gap:6px;align-items:center;margin-bottom:3px}
.lname{font-family:var(--mono);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname i{color:var(--ink-2);font-style:normal}
.ms{display:flex;gap:2px}
.ms button{font-size:7.5px;font-weight:800;width:18px;height:18px;border-radius:1px;color:var(--ink-2);
  background:var(--chassis-hi);box-shadow:inset 0 0 0 1px var(--hair)}
.ms button[aria-pressed="true"]{color:#fff;background:var(--signal)}
.ms button.s[aria-pressed="true"]{color:var(--ink);background:var(--sulphur)}
.lrow .step{aspect-ratio:auto;min-height:20px}

/* timeline */
.tl{display:flex;background:var(--screen);border-radius:2px;overflow:hidden}
.tl-heads{flex:none;width:132px;border-right:1px solid rgba(255,255,255,.14)}
.tl-sp{border-bottom:1px solid rgba(255,255,255,.14)}
.th{display:flex;align-items:center;gap:5px;padding:0 5px;box-sizing:border-box;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.07)}
.th:hover{background:rgba(255,255,255,.06)}
.th.on{background:rgba(224,48,30,.2)}
.th .sw{width:3px;height:58%;flex:none}
.th .nm{font-family:var(--mono);font-size:9px;color:var(--trace);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .nm b{color:var(--trace-dim);font-weight:400}
.th .ms button{width:16px;height:16px;font-size:7px;color:var(--trace-dim);background:#1a1a1c;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.th .ms button[aria-pressed="true"]{color:#fff;background:var(--signal)}
.th .ms button.s[aria-pressed="true"]{color:var(--ink);background:var(--sulphur)}
.tl-scroll{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#tlCanvas{display:block;touch-action:pan-x}
.tl-empty{padding:16px 12px;font-family:var(--mono);font-size:9.5px;color:var(--trace-dim);line-height:1.7}

/* takes */
.takes{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.take{display:flex;align-items:center;gap:8px;padding:5px 8px;box-shadow:inset 0 0 0 1px var(--hair);border-radius:2px}
.take .nm{font-family:var(--mono);font-size:9.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take audio{height:26px;max-width:180px}
.take a{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink);
  text-decoration:none;padding:6px 9px;border-radius:2px;background:linear-gradient(180deg,var(--chassis-hi),var(--chassis-lo));
  box-shadow:0 1px 0 rgba(0,0,0,.3)}

.hint{font-family:var(--mono);font-size:9px;line-height:1.8;color:var(--ink-2)}
.hint b{color:var(--ink);font-weight:700}

@media (max-width:860px){
  .deck{grid-template-columns:1fr}
  .slider-cell{width:100%;flex:none}
  .step{min-height:20px}
  .lrow{grid-template-columns:minmax(52px,64px) auto 1fr;gap:4px}
  .lrow .step{min-height:17px}
  .tl-heads{width:98px}
  .th .nm{font-size:8px}
  .mast h1{font-size:12px;letter-spacing:.34em}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="machine">

  <div class="mast">
    <h1>The Crate</h1>
    <span class="dot"></span>
    <span class="rule"></span>
    <span class="spec">TC-16 · 16 pad · 4 bank · sampler</span>
  </div>

  <!-- CRATE -->
  <div class="pane">
    <span class="silk">Crate</span>
    <div class="crate-row">
      <div class="field"><input id="q" type="text" placeholder="artist or track" autocomplete="off" spellcheck="false" aria-label="Search for a track"></div>
      <button class="btn" id="dig">Dig</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="results" id="results" role="listbox" aria-label="Search results"></div>
  </div>

  <!-- DECK -->
  <div class="pane">
    <div class="deck">
      <section>
        <div class="screen">
          <div class="scr-head"><span id="scrPad">Pad</span><span id="scrState">Empty</span></div>
          <div class="scr-title" id="scrTitle">No sample loaded</div>
          <div class="scr-sub" id="scrSub">Dig, drop a file on a pad, or load a kit.</div>
          <canvas id="ridge" width="600" height="300" aria-label="Stacked waveform of the selected chop"></canvas>
          <canvas id="trim" width="600" height="60" aria-label="Trim bar. Drag to set chop start and end."></canvas>
          <div class="scr-foot">
            <span id="scrStart">In 0.00</span><span id="scrLen">Len 0.00</span>
            <span id="scrEnd">Out 0.00</span><span id="scrRate">Rate 1.00</span>
          </div>
        </div>

        <div class="mod">
          <span class="silk">Pad</span>
          <div class="knobs">
            <label class="knob"><span class="kh"><span class="silk">Pitch</span><span class="kv" id="vPitch">0</span></span>
              <input type="range" id="pitch" min="-24" max="24" step="1" value="0"></label>
            <label class="knob"><span class="kh"><span class="silk">Level</span><span class="kv" id="vLevel">80</span></span>
